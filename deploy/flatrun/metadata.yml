name: Trakli
description: AI-native personal income & expense tracking. Full web stack — API, worker, and web UI — with MySQL and Redis.
icon: pi pi-wallet
logo: https://raw.githubusercontent.com/trakli/trakli/main/logo.svg
category: application
priority: 75
container_port: 3000
quick_actions:
  - id: generate-key
    name: Generate App Key
    command: php artisan key:generate --force
    description: Generate APP_KEY in .env (run once after first deploy)
    icon: pi pi-key
    service: app
  - id: migrate
    name: Run Migrations
    command: php artisan migrate --force
    description: Create the database schema (run after Generate App Key)
    icon: pi pi-database
    service: app
  - id: optimize
    name: Optimize
    command: php artisan optimize
    description: Clear and rebuild all caches
    icon: pi pi-bolt
    service: app
mounts:
  - id: storage
    name: Storage
    container_path: /var/www/html/storage
    description: Laravel storage — logs, cache, and uploaded files
    type: file
    required: false
    user: "1000:1000"
files:
  - path: .env
    content: |
      APP_NAME=Trakli
      APP_ENV=production
      APP_KEY=
      APP_DEBUG=false
      APP_URL=${APP_URL}

      LOG_CHANNEL=stack
      LOG_DEPRECATIONS_CHANNEL=null
      LOG_LEVEL=error

      DB_CONNECTION=mysql
      DB_HOST=mysql
      DB_PORT=3306
      DB_DATABASE=${DB_DATABASE:-trakli}
      DB_USERNAME=${DB_USERNAME:-trakli}
      DB_PASSWORD=${DB_PASSWORD}

      BROADCAST_DRIVER=log
      CACHE_DRIVER=redis
      FILESYSTEM_DISK=local
      QUEUE_CONNECTION=redis
      SESSION_DRIVER=redis
      SESSION_LIFETIME=120

      REDIS_HOST=redis
      REDIS_PASSWORD=${REDIS_PASSWORD}
      REDIS_PORT=6379

      MAIL_MAILER=log
      MAIL_HOST=null
      MAIL_PORT=2525
      MAIL_USERNAME=null
      MAIL_PASSWORD=null
      MAIL_ENCRYPTION=null
      MAIL_FROM_ADDRESS="noreply@localhost"
      MAIL_FROM_NAME="${APP_NAME}"

      # Web UI public origin (protocol + host). Must exactly match the web UI
      # URL FlatRun assigns, or the browser will reject API responses (CORS).
      CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      # Browser-facing API base URL: <APP_URL>/api/v1
      NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL}

      USER_AUTH_REQUIRE_EMAIL_VERIFICATION=true
      USER_AUTH_REQUIRE_PHONE_VERIFICATION=false
      USER_AUTH_CODE_LENGTH=6
      USER_AUTH_CODE_EXPIRY_MINUTES=5
      USER_AUTH_RATE_LIMIT_ATTEMPTS=3
      USER_AUTH_RATE_LIMIT_MINUTES=5
      USER_AUTH_VERIFICATION_PROVIDER=smartpings
      USER_AUTH_SELF_MANAGED=false
      USER_AUTH_ROUTE_PREFIX=api/v1
      MODEL_CONFIG_ROUTE_PREFIX=api/v1

      SMARTPINGS_CLIENT_ID=
      SMARTPINGS_SECRET_ID=

      FIREBASE_CREDENTIALS=storage/app/firebase-auth.json

      MCP_ENABLED=false
      MCP_ENDPOINT=mcp
      MCP_AUTH_GUARD=sanctum
      MCP_RATE_LIMIT_ENABLED=true
      MCP_RATE_LIMIT_MAX=60
      MCP_RATE_LIMIT_DECAY=1
      MCP_STRICT_PERMISSIONS=false

      TOKEN_USAGE_REGISTER_ROUTES=false

      IMAGE_TAG=${IMAGE_TAG:-v2.0.0-beta.1}
      WEBUI_IMAGE_TAG=${WEBUI_IMAGE_TAG:-v2.0.0-beta.1}
backup:
  container_paths:
    - service: app
      container_path: /var/www/html/storage
      description: Laravel storage directory (logs, cache, uploads)
      required: true
    - service: app
      container_path: /var/www/html/.env
      description: Environment configuration
      required: true
  databases:
    - service: app
      type: mysql
      host_env: DB_HOST
      port_env: DB_PORT
      user_env: DB_USERNAME
      password_env: DB_PASSWORD
      database_env: DB_DATABASE
  pre_hooks:
    - service: app
      command: php artisan down --retry=60
      timeout: 30
  post_hooks:
    - service: app
      command: php artisan up
      timeout: 30
