# Trakli — FlatRun template
#
# Self-contained Trakli stack for FlatRun (https://flatrun.dev). Adapted from
# docker-compose.selfhost.yml (PR 1 of issue #308). FlatRun injects its own
# reverse proxy, so services use `expose:` and attach to the external `proxy`
# network instead of publishing host ports.
#
# Notes:
#   - `migrate` is exposed as a quick_action (FlatRun has no deploy-time hook
#     for one-shot dependency ordering — this is a platform limitation, not a
#     bug). After deploy, click "Run Migrations" in the FlatRun dashboard.
#   - APP_KEY is generated by the "Generate App Key" quick_action
#     (`php artisan key:generate --force`) — you do NOT generate it manually.
#   - `smartql` (--profile ai) and `reverb` (--profile realtime) are off by
#     default.

name: ${NAME}

services:
  mysql:
    image: mysql:8.0
    container_name: ${NAME}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-trakli}
      MYSQL_USER: ${DB_USERNAME:-trakli}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - trakli

  redis:
    image: redis:alpine
    container_name: ${NAME}-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - trakli

  migrate:
    image: ghcr.io/trakli/webservice:${IMAGE_TAG}
    container_name: ${NAME}-migrate
    restart: "no"
    command: php artisan migrate --force
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trakli

  app:
    image: ghcr.io/trakli/webservice:${IMAGE_TAG}
    container_name: ${NAME}-app
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    expose:
      - "80"
    networks:
      - trakli
      - proxy

  worker:
    image: ghcr.io/trakli/webservice:${IMAGE_TAG}
    container_name: ${NAME}-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=300 --sleep=3
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trakli

  webui:
    image: ghcr.io/trakli/webui:${WEBUI_IMAGE_TAG}
    container_name: ${NAME}-webui
    restart: unless-stopped
    environment:
      # Must be the public URL the browser uses to reach the API — e.g.
      # https://<app-subdomain>.flatrun.dev/api/v1
      - NUXT_PUBLIC_API_BASE_URL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    expose:
      - "3000"
    networks:
      - trakli
      - proxy

  smartql:
    image: ghcr.io/trakli/webservice:${IMAGE_TAG}
    container_name: ${NAME}-smartql
    restart: unless-stopped
    command: php artisan smartql:serve
    profiles:
      - ai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trakli

  reverb:
    image: ghcr.io/trakli/webservice:${IMAGE_TAG}
    container_name: ${NAME}-reverb
    restart: unless-stopped
    command: php artisan reverb:start
    profiles:
      - realtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "6001"
    networks:
      - trakli
      - proxy

networks:
  trakli:
    driver: bridge
  proxy:
    external: true

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
